name: Bot2 humor

on:
  schedule:
    - cron: "0 6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "card / meme / history / result (пусто = по расписанию)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bot2

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests feedparser

      - name: Run bot
        run: pyt
