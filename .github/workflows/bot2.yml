name: Bot2 humor

on:
  schedule:
    - cron: "0 6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "joke / meme / history / situation (пусто = по расписанию)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bot2

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests feedparser

      - name: Run bot
        run: python bot2.py
        env:
          BOT2_TOKEN: ${{ secrets.BOT2_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIND: ${{ github.event.inputs.kind }}

      - name: Save state
        run: |
          git config user.name "bot2"
          git config user.email "bot2@users.noreply.github.com"
          git add bot2_state.json
          git diff --cached --quiet || (git commit -m "bot2 state" && git pull --rebase && git push)
