name: Football bot

on:
  schedule:
    - cron: "7 1-23/2 * * *"   # посты раз в 2 часа (00:07, 02:07 ... по Москве)
  workflow_dispatch:
    inputs:
      mode:
        description: "Что запустить"
        type: choice
        options: [post, digest]
        default: post

permissions:
  contents: write

concurrency: bot

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODE: ${{ github.event.schedule == '45 19 * * *' && 'digest' || inputs.mode || 'post' }}
      - name: Save state
        run: |
          if [ -f posted.json ]; then
            git config user.name "s-ydarom-bot"
            git config user.email "bot@users.noreply.github.com"
            git add posted.json
            git diff --cached --quiet || (git commit -m "update state" && git push)
          fi
